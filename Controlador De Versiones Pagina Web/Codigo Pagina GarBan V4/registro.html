<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta – GARBAN</title>
  
  <!-- SweetAlert2 CSS y JS corregidos mediante CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="registro.css" />
</head>
<body>

  <!-- BACK LINK -->
  <a href="garban_home.html" class="back-link">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Volver a la tienda
  </a>

  <div class="register-wrapper">

    <!-- HEADER -->
    <div class="register-header">
      <p class="brand-label">Garban Deluxe</p>
      <h1>Crea tu cuenta</h1>
      <p>Es gratis y solo toma un momento.</p>
    </div>

    <!-- FORM -->
    <form class="register-form" action="Registro.php" method="post">

       <!-- Tipo ID + Id_cliente  -->
      <div class="form-row">
        <div class="form-group">
          <label for="Tipo_ID"><span class="req">Tipo de identificación *</span></label>
          <select id="Tipo_ID" name="Tipo_ID">
              <option value="Seleccion">Seleccione una opción</option>
              <option value="RC">RC (Registro Civil)</option>
              <option value="TI">TI (Tarjeta de Identidad)</option>
              <option value="CC">CC (Cédula de Ciudadanía)</option>
              <option value="CE">CE (Cédula de Extranjería)</option>
              <option value="PP">PP (Pasaporte)</option>
              <option value="NIT">NIT (Número de Identificación Tributaria)</option>
              <option value="PEP">PEP (Permiso Especial de Permanencia)</option>
            </select>
        </div>
        <div class="form-group">
          <label for="Id_cliente">Número de identificación <span class="req">*</span></label>
          <input type="number" id="Id_cliente" name="Id_cliente" placeholder="1034791345" inputmode="numeric" />
        </div>
      </div>

      <!-- Nombre + Apellido -->
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre <span class="req">*</span></label>
          <input type="text" id="nombre" name="nombre" placeholder="Juan" />
        </div>
        <div class="form-group">
          <label for="apellido">Apellido <span class="req">*</span></label>
          <input type="text" id="apellido" name="apellido" placeholder="García" />
        </div>
      </div>

      <!-- Correo -->
      <div class="form-group">
        <label for="email">Correo electrónico <span class="req">*</span></label>
        <input type="email" id="email" name="email" placeholder="juan@ejemplo.com" />
      </div>

      <!-- Teléfono -->
      <div class="form-group">
        <label for="phone">Teléfono <span class="req">*</span></label>
        <div class="phone-row">
          <div class="select-wrapper">
          </div>
          <input type="tel" id="phone" name="phone" placeholder="300 000 0000" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')" />
        </div>
      </div>

      <!-- Fecha de nacimiento -->
      <div class="form-group">
        <label>Fecha de nacimiento</label>
        <div class="date-row">
          <div class="select-wrapper">
            <select name="dia" id="dia">
              <option value="" disabled selected>Día</option>
              <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
              <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
              <option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
              <option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option>
              <option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option>
              <option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option>
              <option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option>
              <option value="29">29</option><option value="30">30</option><option value="31">31</option>
            </select>
          </div>
          <div class="select-wrapper">
            <select name="mes" id="mes">
              <option value="" disabled selected>Mes</option>
              <option value="1">Enero</option><option value="2">Febrero</option>
              <option value="3">Marzo</option><option value="4">Abril</option>
              <option value="5">Mayo</option><option value="6">Junio</option>
              <option value="7">Julio</option><option value="8">Agosto</option>
              <option value="9">Septiembre</option><option value="10">Octubre</option>
              <option value="11">Noviembre</option><option value="12">Diciembre</option>
            </select>
          </div>
          <div class="select-wrapper">
            <select name="anio" id="anio">
              <option value="" disabled selected>Año</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Género -->
      <div class="form-group">
        <label>Género <span class="req">*</span></label>
        <div class="gender-group">
          <input type="radio" id="gen-femenino" name="genero" value="Femenino" class="gender-radio"/>
          <label for="gen-femenino" class="gender-btn">Femenino</label>

          <input type="radio" id="gen-masculino" name="genero" value="Masculino" class="gender-radio" />
          <label for="gen-masculino" class="gender-btn">Masculino</label>

          <input type="radio" id="gen-no-especifica" name="genero" value="No especificar" class="gender-radio" />
          <label for="gen-no-especifica" class="gender-btn">No especificar</label>
        </div>
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña <span class="req">*</span></label>
        <div class="input-icon-wrap">
          <input type="password" id="password" name="password" placeholder="Crea una contraseña segura"/>
          <button type="button" class="toggle-password" onclick="togglePass('password', this)" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <!-- Confirmar contraseña -->
      <div class="form-group">
        <label for="password2">Confirmar contraseña <span class="req">*</span></label>
        <div class="input-icon-wrap">
          <input type="password" id="password2" name="password2" placeholder="Repite tu contraseña"/>
          <button type="button" class="toggle-password" onclick="togglePass('password2', this)" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <!-- Checkboxes -->
      <div class="checkboxes">
        <label class="checkbox-label">
          <input type="checkbox" name="terminos" id="terminos" />
          <span>
            Acepto los <a href="#">Términos y Condiciones</a> y la
            <a href="#">Política de Privacidad</a> de Garban <span class="req">*</span>
          </span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="newsletter" />
          <span>Quiero recibir ofertas exclusivas, novedades y contenido personalizado de Garban Deluxe</span>
        </label>
      </div>

      <!-- Submit (Sin onclick) -->
      <a href="garban_home.html"><button type="submit" class="btn-submit">Crear mi cuenta</button></a>

      <!-- Divider -->
      <div class="divider">O regístrate con</div>

      <!-- Social -->
      <div class="social-buttons">
        <a href="#" class="btn-social">
          <svg class="g-icon" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 20-8 20-20 0-1.3-.1-2.7-.4-4z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.1 18.9 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.2 0-9.6-2.9-11.3-7.1l-6.6 5.1C9.6 39.5 16.3 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.2-2.3 4.1-4.3 5.4l6.2 5.2C41 35.3 44 30 44 24c0-1.3-.1-2.7-.4-4z"/>
          </svg>
          Google
        </a>
        <a href="#" class="btn-social">
          <span class="fb-icon">
            <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
          </span>
          Facebook
        </a>
      </div>

      <!-- Login link -->
      <p class="login-link">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>

    </form>
  </div>

  <script>
    // Garantizamos que la lógica corra cuando el DOM esté completamente cargado
    document.addEventListener('DOMContentLoaded', function () {

      // Rellenar dinámicamente los años
      const yearSelect = document.getElementById('anio');
      if (yearSelect) {
        const currentYear = new Date().getFullYear();
        for (let y = currentYear - 10; y >= currentYear - 100; y--) {
          const opt = document.createElement('option');
          opt.value = y;
          opt.textContent = y;
          yearSelect.appendChild(opt);
        }
      }

      const registerForm = document.querySelector('.register-form');

      if (registerForm) {
        registerForm.addEventListener('submit', function (e) {
          e.preventDefault(); // Detiene el envío predeterminado

          // 1. CAPTURA DE VALORES
          const tipoId = document.querySelector('select[name="Tipo_ID"]').value;
          const idCliente = document.getElementById('Id_cliente').value.trim();
          const nombre = document.getElementById('nombre').value.trim();
          const apellido = document.getElementById('apellido').value.trim();
          const email = document.getElementById('email').value.trim();
          
          const telefono = document.getElementById('phone').value.trim();

          const diaNac = document.getElementById('dia').value;
          const mesNac = document.getElementById('mes').value;
          const anioNac = document.getElementById('anio').value;

          const generoSelected = document.querySelector('input[name="genero"]:checked');
          const genero = generoSelected ? generoSelected.value : '';

          const password = document.getElementById('password').value.trim();
          const password2 = document.getElementById('password2').value.trim();

          const terminos = document.getElementById('terminos').checked;

          // 2. VALIDACIONES

          // Campos básicos obligatorios
          if (
            tipoId === 'Seleccion' || 
            tipoId === '' ||
            idCliente === '' ||
            nombre === '' ||
            apellido === '' ||
            email === '' ||
            password === '' ||
            password2 === '' ||
            telefono === ''
          ) {
            Swal.fire({
              icon: 'warning',
              title: 'Campos incompletos',
              text: 'Por favor llena todos los campos marcados con (*).'
            });
            return;
          }

          // Validación de Fecha de Nacimiento
          if (diaNac === '' || mesNac === '' || anioNac === '') {
            Swal.fire({
              icon: 'warning',
              title: 'Fecha incompleta',
              text: 'Por favor selecciona día, mes y año de nacimiento.'
            });
            return;
          }

          // Validación de Género
          if (genero === '') {
            Swal.fire({
              icon: 'warning',
              title: 'Selecciona tu género',
              text: 'Por favor elige una opción de género.'
            });
            return;
          }

          // Validación de Teléfono (entre 7 y 10 dígitos)
          const regexTel = /^[0-9]{7,10}$/;
          if (telefono !== '' && !regexTel.test(telefono)) {
            Swal.fire({
              icon: 'warning',
              title: 'Teléfono inválido',
              text: 'El teléfono debe contener entre 7 y 10 dígitos numéricos.'
            });
            return;
          }
          // Validacion del largo de la contarseña
          if (password.length < 8) {
            Swal.fire ({
              icon: 'error',
              title: 'La Contraseña Debe De tener Como Minimo 8 Caracteres',
              text: 'Asegurate De Escribir una Contraseña Valida' 
            })
            return; 
          }

          // Validación de Contraseñas coincidentes
          if (password !== password2) {
            Swal.fire({
              icon: 'error',
              title: 'Las contraseñas no coinciden',
              text: 'Asegúrate de ingresar la misma contraseña en ambos campos.'
            });
            return;
          }

          // Validación de Términos y condiciones
          if (!terminos) {
            Swal.fire({
              icon: 'warning',
              title: 'Términos y Condiciones',
              text: 'Debes aceptar los Términos y la Política de Privacidad para continuar.'
            });
            return;
          }

          // 3. ÉXITO DE VALIDACIÓN
          Swal.fire({
            icon: 'success',
            title: '¡Registro exitoso!',
            text: 'Tu cuenta ha sido creada correctamente.',
            showConfirmButton: false,
            timer: 2000
          }).then(() => {
            // Envía el formulario formalmente al PHP o redirige
            registerForm.submit();
          });
        });
      }
    });

    // Función independiente para visibilidad de contraseña
    function togglePass(id, btn) {
      const input = document.getElementById(id);
      if (input) {
        input.type = input.type === 'password' ? 'text' : 'password';
        btn.querySelector('svg').style.opacity = input.type === 'text' ? '1' : '0.5';
      }
    }
  </script>

</body>
</html>
