<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Garban</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="garban.css">
</head>
<body>

  <main class="auth">
    <!-- Panel visual -->
    <section class="auth-visual">
      <div class="auth-visual-overlay">
        <p class="auth-visual-title">
          Bienvenido a <span>Garban</span>
        </p>
        <p class="auth-visual-text">Elegancia y estilo en cada prenda</p>
      </div>
    </section>

    <!-- Panel de formulario -->
    <section class="auth-panel">
      <div class="auth-panel-inner">
        <a href="garban_home.html" class="auth-back">
          <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Volver a la tienda
        </a>

        <form class="auth-form" action="garban_home.html">

  <div class="form-field">
    <label for="email">Correo Electrónico</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="tu@email.com"
      required>
  </div>

  <div class="form-field">
    <label for="password">Contraseña</label>
    <input
      type="password"
      id="password"
      name="password"
      placeholder="••••••••"
      required>
  </div>

  <button type="submit" class="btn-gold">
    Iniciar Sesión
  </button>

</form>
   
</script>
          <div class="auth-divider">
            <span>O continúa con</span>
          </div>

          <div class="auth-social">
            <button type="button" class="btn-social">
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.69-2.26 1.1-3.71 1.1-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A10.99 10.99 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.14a6.6 6.6 0 0 1 0-4.27V7.03H2.18a11 11 0 0 0 0 9.94l3.66-2.83z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.03l3.66 2.84c.87-2.6 3.3-4.49 6.16-4.49z"/></svg>
              Google
            </button>
            <button type="button" class="btn-social">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="#1877F2"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.13 8.44 9.94v-7.03H7.9v-2.91h2.54V9.84c0-2.5 1.49-3.89 3.78-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.87h2.78l-.45 2.91h-2.33V22c4.78-.81 8.44-4.94 8.44-9.94z"/></svg>
              Facebook
            </button>
          </div>

          <p class="auth-footer-text">
            ¿No tienes una cuenta? <a href="registro.html" class="auth-footer-link">Regístrate aquí</a>
          </p>
           <p class="auth-footer-text">
            desea cambiar su contraseña <a href="registro.html" class="auth-footer-link">cambiela aqui</a>
          </p>
        </form>
      </div>
    </section>
  </main>

</body>
</html>
