<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta – GARBAN</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="registro.css" />
</head>
<body>

  <!-- BACK LINK -->
  <a href="garban_home.html" class="back-link">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Volver a la tienda
  </a>

  <div class="register-wrapper">

    <!-- HEADER -->
    <div class="register-header">
      <p class="brand-label">Garban Deluxe</p>
      <h1>Crea tu cuenta</h1>
      <p>Es gratis y solo toma un momento.</p>
    </div>

    <!-- FORM -->
    <form class="register-form">

      <!-- Nombre + Apellido -->
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre <span class="req">*</span></label>
          <input type="text" id="nombre" name="nombre" placeholder="Juan" required />
        </div>
        <div class="form-group">
          <label for="apellido">Apellido <span class="req">*</span></label>
          <input type="text" id="apellido" name="apellido" placeholder="García" required />
        </div>
      </div>

      <!-- Correo -->
      <div class="form-group">
        <label for="email">Correo electrónico <span class="req">*</span></label>
        <input type="email" id="email" name="email" placeholder="juan@ejemplo.com" required />
      </div>

      <!-- Teléfono -->
      <div class="form-group">
        <label>Teléfono</label>
        <div class="phone-row">
          <div class="select-wrapper">
            <select name="phone-prefix">
              <option value="+57">co +57</option>
              <option value="+1">us +1</option>
              <option value="+52">mx +52</option>
              <option value="+34">es +34</option>
              <option value="+54">ar +54</option>
              <option value="+56">cl +56</option>
              <option value="+51">pe +51</option>
            </select>
          </div>
          <input type="tel" required name="phone" placeholder="300 000 0000" pattern="[0-9]{7,10}" maxlength="10" inputmode="numeric" title="Ingresa solo números (7 a 10 dígitos)" oninput="this.value = this.value.replace(/[^0-9]/g, '')" />
        </div>
      </div>

      <!-- Fecha de nacimiento -->
      <div class="form-group">
        <label>Fecha de nacimiento</label>
        <div class="date-row">
          <div class="select-wrapper">
            <select name="dia" required>
              <option value="" disabled selected>Día</option>
              <!-- días -->
              <option>1</option><option>2</option><option>3</option><option>4</option>
              <option>5</option><option>6</option><option>7</option><option>8</option>
              <option>9</option><option>10</option><option>11</option><option>12</option>
              <option>13</option><option>14</option><option>15</option><option>16</option>
              <option>17</option><option>18</option><option>19</option><option>20</option>
              <option>21</option><option>22</option><option>23</option><option>24</option>
              <option>25</option><option>26</option><option>27</option><option>28</option>
              <option>29</option><option>30</option><option>31</option>
            </select>
          </div>
          <div class="select-wrapper">
            <select name="mes" required>
              <option value="" disabled selected>Mes</option>
              <option value="1">Enero</option><option value="2">Febrero</option>
              <option value="3">Marzo</option><option value="4">Abril</option>
              <option value="5">Mayo</option><option value="6">Junio</option>
              <option value="7">Julio</option><option value="8">Agosto</option>
              <option value="9">Septiembre</option><option value="10">Octubre</option>
              <option value="11">Noviembre</option><option value="12">Diciembre</option>
            </select>
          </div>
          <div class="select-wrapper">
            <select name="anio" id="anio" required>
              <option value="" disabled selected>Año</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Género -->
      <div class="form-group">
        <label>Género <span class="req">*</span></label>
        <div class="gender-group">
          <input type="radio" id="gen-femenino" name="genero" value="Femenino" class="gender-radio" required />
          <label for="gen-femenino" class="gender-btn">Femenino</label>

          <input type="radio" id="gen-masculino" name="genero" value="Masculino" class="gender-radio" />
          <label for="gen-masculino" class="gender-btn">Masculino</label>

          <input type="radio" id="gen-no-especifica" name="genero" value="No especificar" class="gender-radio" />
          <label for="gen-no-especifica" class="gender-btn">No especificar</label>
        </div>
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña <span class="req">*</span></label>
        <div class="input-icon-wrap">
          <input type="password" id="password" name="password" placeholder="Crea una contraseña segura" required />
          <button type="button" class="toggle-password" onclick="togglePass('password', this)" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <!-- Confirmar contraseña -->
      <div class="form-group">
        <label for="password2">Confirmar contraseña <span class="req">*</span></label>
        <div class="input-icon-wrap">
          <input type="password" id="password2" name="password2" placeholder="Repite tu contraseña" required />
          <button type="button" class="toggle-password" onclick="togglePass('password2', this)" aria-label="Mostrar contraseña">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <!-- Checkboxes -->
      <div class="checkboxes">
        <label class="checkbox-label">
          <input type="checkbox" name="terminos" required />
          <span>
            Acepto los <a href="#">Términos y Condiciones</a> y la
            <a href="#">Política de Privacidad</a> de Garban <span class="req">*</span>
          </span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="newsletter" />
          <span>Quiero recibir ofertas exclusivas, novedades y contenido personalizado de Garban Deluxe</span>
        </label>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-submit">Crear mi cuenta</button>

      <!-- Divider -->
      <div class="divider">O regístrate con</div>

      <!-- Social -->
      <div class="social-buttons">
        <a href="#" class="btn-social">
          <!-- Google SVG -->
          <svg class="g-icon" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 20-8 20-20 0-1.3-.1-2.7-.4-4z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.1 18.9 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.2 0-9.6-2.9-11.3-7.1l-6.6 5.1C9.6 39.5 16.3 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.2-2.3 4.1-4.3 5.4l6.2 5.2C41 35.3 44 30 44 24c0-1.3-.1-2.7-.4-4z"/>
          </svg>
          Google
        </a>
        <a href="#" class="btn-social">
          <span class="fb-icon">
            <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
          </span>
          Facebook
        </a>
      </div>

      <!-- Login link -->
      <p class="login-link">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>

    </form>
  </div>

  <script>
    // Populate years
    const yearSelect = document.getElementById('anio');
    const currentYear = new Date().getFullYear();
    for (let y = currentYear - 10; y >= currentYear - 100; y--) {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      yearSelect.appendChild(opt);
    }

    // Toggle password visibility
    function togglePass(id, btn) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
      btn.querySelector('svg').style.opacity = input.type === 'text' ? '1' : '0.5';
    }

    // Respaldo: forzar validación numérica del teléfono al enviar,
    // por si el navegador no aplica "pattern" en type="tel"
    const registerForm = document.querySelector('.register-form');
    const phoneInput = registerForm.querySelector('input[name="phone"]');

    registerForm.addEventListener('submit', function (e) {
      e.preventDefault(); // nunca enviamos el form a ningún lado, solo validamos

      const soloNumeros = /^[0-9]{7,10}$/;
      if (!soloNumeros.test(phoneInput.value)) {
        phoneInput.setCustomValidity('El teléfono debe tener solo números (7 a 10 dígitos).');
      } else {
        phoneInput.setCustomValidity('');
      }

      // checkValidity() revisa TODOS los campos required/pattern del formulario
      if (registerForm.checkValidity()) {
        window.location.href = 'login.html';
      } else {
        registerForm.reportValidity();
      }
    });

    phoneInput.addEventListener('input', function () {
      phoneInput.setCustomValidity('');
    });
  </script>

</body>
</html>
